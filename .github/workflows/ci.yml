name: CI

# Quality gate for day-to-day changes. The separate Release workflow only runs
# on `v*` tags, so master/PR pushes previously had NO build, test, or lint
# check. Frontend build + Rust tests are REQUIRED; formatting/lint run as signal
# while the pre-existing fmt/clippy debt is cleared.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck + build frontend (tsc && vite build, bundle budget enforced)
        run: npm run build

      - name: Frontend unit tests (vitest)
        run: npm run test

      # 前端 lint。**门设在 error 级为零**，warn 不阻塞。
      #
      # 只开抓 bug 的两组（correctness / suspicious），装饰性的全关。全量 recommended
      # 跑出来是 544 条，其中 263 条是「<button> 缺 type」、31 条是模板字符串风格——
      # 这个量级没人会看，真信号会被淹掉。收窄后 102 条，全部落在
      # useExhaustiveDependencies（hook 依赖漏项 → 陈旧闭包）和 noArrayIndexKey
      # （用下标当 key → 列表重排错乱）这两类上，是真会出事的。
      #
      # 那两类目前 96 条设为 warn：它们要逐个看依赖数组的语义，一次性改完风险比
      # 收益大。error 级已经清零（改了 5 处 forEach 隐式返回 + 1 处把非 hook 函数
      # 命名成 usePreset），所以门先立在这里，新增的 error 当场拦。
      - name: Frontend lint（biome，error 阻塞）
        run: npx biome lint src --diagnostic-level=error

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust tests (required)
        working-directory: ./src-tauri
        run: cargo test --lib

      # ── 阻塞门：这个项目自己踩过的坑 ──────────────────────────────────
      # CLAUDE.md 记着三条历史事故。写下来跟拦得住是两回事，这两步负责拦。

      - name: 坑点守卫（阻塞）
        shell: bash
        run: bash .github/scripts/pitfall-guard.sh

      # 全量 clippy 当门。以前这里只开 `await_holding_lock` 一条（坑点2「跨 await
      # 持有 std::sync 锁」，文本匹配判不了作用域，得靠 clippy 做真正的作用域分析），
      # 理由是「不受那堆 clippy 欠债影响」——那堆欠债现在清零了（6 条，逐条按语义
      # 修，两条测试里的显式 allow 并写明理由），所以直接上 -D warnings。
      #
      # 现在加最便宜：欠债为 0 时开门，之后每一条都是新债，当场就能拦。等积累到
      # 几百条再想开，就没人愿意开了。await_holding_lock 属于 clippy::all，被这条
      # 覆盖，不再单列。
      - name: Rust lint（clippy，阻塞）
        working-directory: ./src-tauri
        run: cargo clippy --lib --tests --quiet -- -D warnings

      # ── 非阻塞信号：但**必须看得见** ──────────────────────────────────
      # 这三步以前是 continue-on-error，失败也显示绿勾——等于没有这一步，还
      # 骗人。现在自己捕获退出码，把失败写进 Job Summary 和 ::warning:: 注解：
      # 不阻塞合并，但绝不假装通过。
      #
      # 现状（2026-08-03 实测）：rustfmt 有 922 处待重排、clippy 有历史欠债，
      # 清干净之前不能设成阻塞，否则 CI 会一直红到没人看。

      - name: 遗留检查（不阻塞，但如实报告）
        shell: bash
        working-directory: ./src-tauri
        run: |
          set +e
          status=0
          report() {  # $1=名称 $2=退出码 $3=日志文件
            if [ "$2" -ne 0 ]; then
              echo "### ❌ $1 未通过" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 25 "$3" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$1 未通过（不阻塞，详情见 Job Summary）"
              status=1
            else
              echo "### ✅ $1 通过" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          # 被 #[ignore] 的用例需要真机环境或是已知不稳定的压力测试，不能当门；
          # 但要跑，否则会像 test_memory_injection 那样烂在那里没人发现。
          cargo test --lib -- --ignored > ignored.log 2>&1
          report "手动/ignored 用例" $? ignored.log

          cargo fmt --check > fmt.log 2>&1
          report "rustfmt" $? fmt.log

          cargo clippy --lib -- -D warnings > clippy.log 2>&1
          report "clippy（全量）" $? clippy.log

          if [ "$status" -ne 0 ]; then
            echo ""
            echo "以上为非阻塞信号：不拦合并，但确实没通过。"
          fi
          exit 0
